<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/edit.css') }}">		<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Edit Profile</title>
</head>
<body>
    <nav class="sidebar">
        <div id="wtf">
            <h1 id="info">INFORMASI AKUN</h1>
            <h2 id="profil"><a href="{{ url_for('edit_profile', user_id=account[0]) }}">Edit profil</a></h2>
            <h2 id="beranda"><a href="{{ url_for('home') }}">Beranda</a></h2>
            <h2 id="keluar"><a href="{{ url_for('logout') }}" onclick="alert('Ingin Keluar?')">Log out</a></h2>
        </div>
    </nav>
    <main>
    {% if account %}
        <form action="{{ url_for('edit_profile', user_id=account[0]) }}" method="post">
            <h1 id="edit">Edit Profile</h1>
            <div class="avatar"></div>
            <div class="name">
                <label for="username">Ganti Username:</label>
                <input type="text" id="username" name="username" value="{{ account[1] }}" required>
            </div>
            <div class="mail">
                <label for="email">Ganti Email:</label>
                <input type="email" id="email" name="email" value="{{ account[3] }}" required>
            </div>
            <div class="phone"></div>
            <div class="house"></div>
            <div class="pay"></div>
            <button type="submit">Update Profile</button>
        </form>
    {% else %}
        <p>Profile not found.</p>
    {% endif %}
    </main>
</body>
</html>
